name: Build, Release & Docker

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # ==============================================================================
  # JOB 1: JAVA BUILD & GITHUB RELEASE
  # ==============================================================================
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Create settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers>" > ~/.m2/settings.xml
          echo "<server><id>github</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-merkletrie</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-rlp</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-cryptoj</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "</servers></settings>" >> ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and build with Maven
        run: |
          CRYPTOJ_VERSION=$(mvn help:evaluate -Dexpression=goldenera-cryptoj.version -q -DforceStdout -s ~/.m2/settings.xml)
          mvn dependency:get -B -Dartifact="global.goldenera.cryptoj:goldenera-cryptoj:${CRYPTOJ_VERSION}" -s ~/.m2/settings.xml
          CRYPTOJ_JAR="$HOME/.m2/repository/global/goldenera/cryptoj/goldenera-cryptoj/${CRYPTOJ_VERSION}/goldenera-cryptoj-${CRYPTOJ_VERSION}.jar"
          CRYPTOJ_SHA256=$(sha256sum "$CRYPTOJ_JAR" | cut -d ' ' -f 1)
          BUILD_GIT_COMMIT=$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')
          mvn clean verify -B -T 1C -s ~/.m2/settings.xml
          mvn package -B -T 1C -DskipTests -Prelease-artifact \
            -Dgoldenera.git.commit="$BUILD_GIT_COMMIT" \
            -Dgoldenera.cryptoj.sha256="$CRYPTOJ_SHA256" \
            -s ~/.m2/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Find Main JAR
        id: find_jar
        run: |
          JAR_FILE=$(find target/ -type f -name "goldenera-node-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_ENV

      - name: Check if release exists
        id: check_release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "v${{ env.VERSION }}" > /dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_ENV
          else
            echo "release_exists=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete existing release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.release_exists == 'true'
        run: gh release delete "v${{ env.VERSION }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "v${{ env.VERSION }}" \
            --title "GoldenEra Node v${{ env.VERSION }}" \
            --generate-notes \
            "${{ env.jar_file }}#goldenera-node.jar"
        env:
          GH_TOKEN: ${{ github.token }}

  # ==============================================================================
  # JOB 2: BUILD IMAGES (MATRIX)
  # ==============================================================================
  build-images:
    needs: build-and-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Restore Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Resolve release build metadata
        id: release_meta
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers>" > ~/.m2/settings.xml
          echo "<server><id>github-cryptoj</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-merkletrie</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "<server><id>github-rlp</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>" >> ~/.m2/settings.xml
          echo "</servers></settings>" >> ~/.m2/settings.xml
          CRYPTOJ_VERSION=$(mvn help:evaluate -Dexpression=goldenera-cryptoj.version -q -DforceStdout -s ~/.m2/settings.xml)
          mvn dependency:get -B -Dartifact="global.goldenera.cryptoj:goldenera-cryptoj:${CRYPTOJ_VERSION}" -s ~/.m2/settings.xml
          CRYPTOJ_JAR="$HOME/.m2/repository/global/goldenera/cryptoj/goldenera-cryptoj/${CRYPTOJ_VERSION}/goldenera-cryptoj-${CRYPTOJ_VERSION}.jar"
          echo "cryptoj_sha256=$(sha256sum "$CRYPTOJ_JAR" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "git_commit=$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "randomx_source_commit=$(mvn help:evaluate -Dexpression=goldenera-randomx.source.commit -q -DforceStdout)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,suffix=-${{ matrix.arch }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: release-runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            BUILD_GIT_COMMIT=${{ steps.release_meta.outputs.git_commit }}
            CRYPTOJ_SHA256=${{ steps.release_meta.outputs.cryptoj_sha256 }}
            RANDOMX_SOURCE_COMMIT=${{ steps.release_meta.outputs.randomx_source_commit }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==============================================================================
  # JOB 3: MERGE MANIFESTS
  # ==============================================================================
  merge-images:
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} || true
