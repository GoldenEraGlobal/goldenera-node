name: Installer smoke tests

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "scripts/entrypoint.sh"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/memory-sizing.sh"
      - "scripts/tests/**"
      - ".github/workflows/installer-smoke.yml"
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "scripts/entrypoint.sh"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/memory-sizing.sh"
      - "scripts/tests/**"
      - ".github/workflows/installer-smoke.yml"

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run memory sizing tests
        run: ./scripts/tests/memory-sizing-test.sh
      - name: Run Bash installer smoke tests
        run: ./scripts/tests/install-smoke.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell installer smoke tests
        shell: pwsh
        run: ./scripts/tests/install-smoke.ps1
