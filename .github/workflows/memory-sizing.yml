name: Memory sizing tests

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "scripts/entrypoint.sh"
      - "scripts/memory-sizing.sh"
      - "scripts/tests/memory-sizing-test.sh"
      - ".github/workflows/memory-sizing.yml"
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "scripts/entrypoint.sh"
      - "scripts/memory-sizing.sh"
      - "scripts/tests/memory-sizing-test.sh"
      - ".github/workflows/memory-sizing.yml"

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run memory sizing tests
        run: ./scripts/tests/memory-sizing-test.sh
