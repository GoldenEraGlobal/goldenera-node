databaseChangeLog:
  - changeSet:
      id: 20260816-01-api-key-webhook-secret
      author: goldenera
      comment: Add API-key-owned webhook signing secrets while preserving legacy per-webhook secrets.
      changes:
        - addColumn:
            tableName: api_key
            columns:
              - column:
                  name: webhook_secret_key
                  type: BYTEA
                  constraints:
                    nullable: true
        - dropNotNullConstraint:
            tableName: webhook
            columnName: secret_key
            columnDataType: BYTEA
        - sql:
            dbms: postgresql
            sql: >-
              UPDATE api_key AS api_key_row
              SET webhook_secret_key = (
                SELECT webhook_row.secret_key
                FROM webhook AS webhook_row
                WHERE webhook_row.created_by_api_key_id = api_key_row.id
                LIMIT 1
              )
              WHERE 1 = (
                SELECT COUNT(DISTINCT webhook_row.secret_key)
                FROM webhook AS webhook_row
                WHERE webhook_row.created_by_api_key_id = api_key_row.id
              )
      rollback:
        - sql:
            sql: >-
              UPDATE webhook
              SET secret_key = (
                SELECT api_key_row.webhook_secret_key
                FROM api_key AS api_key_row
                WHERE api_key_row.id = webhook.created_by_api_key_id
              )
              WHERE webhook.secret_key IS NULL
        - addNotNullConstraint:
            tableName: webhook
            columnName: secret_key
            columnDataType: BYTEA
        - dropColumn:
            tableName: api_key
            columnName: webhook_secret_key
