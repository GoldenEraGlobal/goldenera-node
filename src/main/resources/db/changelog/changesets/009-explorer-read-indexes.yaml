databaseChangeLog:
  - changeSet:
      id: 009-explorer-instant-columns-utc
      author: goldenera
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = current_schema()
                    AND table_name = 'explorer_tx'
                    AND column_name = 'timestamp'
                    AND data_type = 'timestamp without time zone'
                ) THEN
                  ALTER TABLE explorer_tx
                    ALTER COLUMN timestamp TYPE TIMESTAMP(6) WITH TIME ZONE
                    USING timestamp AT TIME ZONE 'UTC';
                END IF;

                IF EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = current_schema()
                    AND table_name = 'explorer_transfer'
                    AND column_name = 'timestamp'
                    AND data_type = 'timestamp without time zone'
                ) THEN
                  ALTER TABLE explorer_transfer
                    ALTER COLUMN timestamp TYPE TIMESTAMP(6) WITH TIME ZONE
                    USING timestamp AT TIME ZONE 'UTC';
                END IF;
              END
              $$;

  - changeSet:
      id: 009-explorer-read-order-indexes
      author: goldenera
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_explorer_account_nonce_nonce_address
              ON explorer_account_nonce (nonce, address);
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_explorer_account_balance_page_order
              ON explorer_account_balance (balance, address, token_address);
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_ex_transfer_page_order
              ON explorer_transfer (timestamp DESC, block_height DESC, tx_index DESC, id DESC);
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_explorer_tx_page_order
              ON explorer_tx (timestamp DESC, block_height DESC, tx_index DESC, hash DESC);
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_explorer_address_alias_lower_alias
              ON explorer_address_alias (LOWER(alias));
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_explorer_account_nonce_nonce_address;
        - sql:
            sql: DROP INDEX IF EXISTS idx_explorer_account_balance_page_order;
        - sql:
            sql: DROP INDEX IF EXISTS idx_ex_transfer_page_order;
        - sql:
            sql: DROP INDEX IF EXISTS idx_explorer_tx_page_order;
        - sql:
            sql: DROP INDEX IF EXISTS idx_explorer_address_alias_lower_alias;

  - changeSet:
      id: 009-explorer-token-trigram-search
      author: goldenera
      dbms: postgresql
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_explorer_token_name_trgm
              ON explorer_token USING GIN (name gin_trgm_ops);
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_explorer_token_smallest_unit_name_trgm
              ON explorer_token USING GIN (smallest_unit_name gin_trgm_ops);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_explorer_token_name_trgm;
        - sql:
            sql: DROP INDEX IF EXISTS idx_explorer_token_smallest_unit_name_trgm;
