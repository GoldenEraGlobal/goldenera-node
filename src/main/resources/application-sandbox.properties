##########################################################################
####################     SANDBOX NODE     ###############################
##########################################################################

# The sandbox execution domain and manifest path must still be supplied
# explicitly. This profile only provides safe sandbox defaults.
ge.core.directory.disable=true
ge.stress-test.enabled=false
# Cache-only RandomX is the bounded local/PR default for an activated sandbox.
ge.core.mining.memory-mode=${MINING_MEMORY_MODE:LIGHT}

# Disabled unless both this switch and manifest features.controlApi are true.
# The mounted token file must be absolute, regular, non-symlink, mode 0400/0600,
# and contain exactly one 43-character unpadded base64url token (32 bytes).
ge.sandbox.control-api.enabled=${SANDBOX_CONTROL_API_ENABLED:false}
ge.sandbox.control-api.token-file=${SANDBOX_CONTROL_API_TOKEN_FILE:}
